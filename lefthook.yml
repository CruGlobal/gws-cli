pre-commit:
  parallel: false
  commands:
    copyright:
      run: scripts/copyright-headers.sh {staged_files}
      stage_fixed: true
    fmt:
      glob: "*.rs"
      run: cargo fmt -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy -- -D warnings

pre-push:
  parallel: true
  commands:
    test:
      glob: "*.rs"
      run: cargo test
    check:
      glob: "*.rs"
      run: cargo check
