# Dependabot only rebases on conflicts, so a PR whose CI Gate failure was since
# fixed on main stays red. When main changes, ask it to rebase failing, behind PRs.
#
# RELEASE_TOKEN: Dependabot ignores bot commands. This job runs no PR code.
name: Dependabot rebase

on:
  push:
    branches: [main]
    paths: ['Cargo.lock', 'deny.toml', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-rebase
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase stale failing PRs
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to rebase
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list -R "$REPO" --author app/dependabot --state open \
                  --json number,headRefOid,statusCheckRollup \
                  --jq '.[] | select(any(.statusCheckRollup[]; .name == "CI Gate" and .conclusion == "FAILURE")) | "\(.number) \(.headRefOid)"')
          while read -r number sha; do
            [ -n "$number" ] || continue
            behind=$(gh api "repos/$REPO/compare/$sha...main" --jq .ahead_by)
            if [ "$behind" = 0 ]; then
              echo "#$number: up to date with main; failure is its own."
              continue
            fi
            echo "#$number: $behind commit(s) behind main; asking Dependabot to rebase."
            gh pr comment -R "$REPO" "$number" --body "@dependabot rebase"
          done <<< "$prs"
