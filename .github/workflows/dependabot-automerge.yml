# Enables GitHub auto-merge on Dependabot PRs for non-breaking bumps.
# The merge only completes once the required "CI Gate" status check passes
# (see branch protection on main). Breaking bumps (major, or 0.x minor) go to
# claude-dependabot-major.yml instead.
name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Below 1.0, semver treats a minor bump (0.10 -> 0.11) as breaking.
      - name: Enable auto-merge for non-breaking updates
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREV: ${{ steps.metadata.outputs.previous-version }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-patch) ;;
            version-update:semver-minor)
              if [[ "$PREV" == 0.* ]]; then
                echo "0.x minor bump ($PREV) is breaking; leaving for Claude adapt."
                exit 0
              fi ;;
            *) echo "Not auto-merging $UPDATE_TYPE."; exit 0 ;;
          esac
          gh pr merge --auto --squash "$PR_URL"
