name: Release (Changeset)

# Requires the RELEASE_TOKEN repository secret (a fine-grained PAT) so the tag it
# pushes re-triggers the Release workflow. See docs/FORK_SETUP.md.

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Release Pull Request or Tag
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-sync
          publish-script: pnpm run tag-release
          commit-message: 'chore: release versions'
          pr-title: 'chore: release versions'
          # v2 pushes via the GitHub API by default; keep git CLI (version-sync stages files).
          push-with-git-cli: true
          # tag-release.sh pushes the tag; release.yml creates the GitHub release.
          create-github-releases: false
          push-git-tags: false
          # v2 ignores the GITHUB_TOKEN env var; pass the token explicitly.
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
